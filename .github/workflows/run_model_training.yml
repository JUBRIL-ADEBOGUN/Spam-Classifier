name: Run Model Training

on:
  push:
    branches:
      - Exp-RF

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r spam-classifier/requirements.txt
        sudo apt-get install -y libfreetype6-dev libpng-dev

    - name: Run model training
      run: |
        python src/model_training.py

    - name: Upload trained model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: models/
        # --- NEW: Upload the entire report directory as an artifact ---
    - name: Upload training report artifact
      uses: actions/upload-artifact@v4
      with:
        name: training-report
        path: src/report/

      # --- NEW: Post the report as a comment on the commit ---
    - name: Read report content
      id: read_report
      uses: juliangruber/read-file-action@v1
      with:
        path: ./src/report/training_report.md

    - name: Post report to commit
      uses: peter-evans/commit-comment@v3
      with:
        body: ${{ steps.read_report.outputs.content }}

  test-model:
    needs: train-model
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download trained model artifact
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: models/

    - name: Run model testing
      run: |
        python tests/test_model.py
