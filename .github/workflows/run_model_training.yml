name: Run Model Training

on:
  push:
    branches:
      - main
      - Exp-RF

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r spam-classifier/requirements.txt

    - name: Run model training
      run: |
        python spam-classifier/src/model_training.py

    - name: Upload trained model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: spam-classifier/models/

  test-model:
    needs: train-model
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r spam-classifier/requirements.txt

    - name: Download trained model artifact
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: spam-classifier/models/

    - name: Run model testing
      run: |
        python spam-classifier/tests/test_model.py