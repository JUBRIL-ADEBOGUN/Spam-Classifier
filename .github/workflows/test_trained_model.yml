name: Test Trained Model

on:
  workflow_run:
    workflows:
      - Run Model Training
    types:
      - completed

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r spam-classifier/requirements.txt

    - name: Test trained model
      run: |
        python spam-classifier/tests/test_model.py
