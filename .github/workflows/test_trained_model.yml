name: Test Trained Model
description: 'This workflow tests the trained spam classifier model after the training workflow completes.'

on:
  workflow_run:
    workflows:
      - Run Model Training
    types:
      - completed

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('spam-classifier/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: spam-classifier
    - name: Test trained model
      run: |
        python src/test_model.py
      working-directory: spam-classifier
        python spam-classifier/src/test_model.py