name: CI/CD Pipeline for Spam Classifier

on:
  push:
    branches:
      - main

jobs:
  # --- JOB 1: Train the Model ---
  train:
    runs-on: ubuntu-latest # STANDARDIZED: Use the same runner for all jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run model training script
        run: python src/model_training.py # SIMPLIFIED: No sub-folder prefix

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/ # SIMPLIFIED: Path from the root

  # --- JOB 2: Test the Model (The Gatekeeper) ---
  test:
    needs: [train]
    runs-on: ubuntu-latest # STANDARDIZED: Consistent environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/ # SIMPLIFIED: Path from the root

      - name: Run model tests with pytest
        run: pytest -v -x tests/
          # python tests/test_model.py # SIMPLIFIED: No sub-folder prefix
          # python tests/test_trained_model.py

  # --- JOB 3: Deploy to Docker Hub (The Final Step) ---
  deploy:
    needs: [test]
    runs-on: ubuntu-latest # STANDARDIZED: Consistent environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download model artifacts for Docker build
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/ # SIMPLIFIED: Path from the root

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # SIMPLIFIED: Build from the repository root
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spam-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spam-classifier:${{ github.run_number }}