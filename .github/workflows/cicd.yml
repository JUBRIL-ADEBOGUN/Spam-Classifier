name: CI/CD Pipeline for Spam Classifier

on:
  push:
    branches:
      - main # Trigger this pipeline on every push to the main branch

jobs:
  # --- JOB 1: Train the Model ---
  train:
    runs-on: ubuntu-latest
    container: docker://ghcr.io/iterative/cml:0-dvc2-base1

    permissions:
      contents: write # Needed for commenting on commits (on: push)
      pull-requests: write # Needed for commenting on PRs (on: pull_request)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.10'

      - name: Install dependencies
        run: | 
            pip install -r spam-classifier/requirements.txt
            # Install system-level font libraries for matplotlib on headless ubuntu
            sudo apt-get install -y libfreetype6-dev libpng-dev

      - name: Run model training script
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python spam-classifier/src/model_training.py # Assumes this script saves artifacts to models
          cat spam-classifier/src/report/training_report.md >> report.md
          cml comment create report.md
          
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: spam-classifier/models/


  # --- JOB 2: Test the Model (The Gatekeeper) ---
  test:
    needs: [train] # This job will only run if the 'train' job succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r spam-classifier/requirements.txt

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: spam-classifier/models/

      - name: Run model tests with pytest
        run: pytest spam-classifier/tests/run_test_model.py

  # --- JOB 3: Deploy to Docker Hub (The Final Step) ---
  deploy:
    needs: [test] # This job will only run if the 'test' job succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download model artifacts for Docker build
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: spam-classifier/models/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spam-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spam-classifier:${{ github.run_number }}
